<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조직건강 및 리스크 관리 - e-HR Dashboard</title>
  <link rel="stylesheet" type="text/css" media="screen" href="./e-HR_files/fontawesome-all.css" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="./e-HR_files/adminlte.min.css">
  <link rel="stylesheet" type="text/css" href="./css/dashboard.css">
</head>
<body>
  <div class="hr-dash" id="hrDashRoot">
    <nav class="hr-dash__nav" aria-label="대시보드 탭">
      <a href="./dashboard01.html">인력현황</a>
      <a href="./dashboard02.html">인력확보 및 유지</a>
      <a href="./dashboard03.html">인재육성 및 조직문화</a>
      <a href="./dashboard04.html" class="on">조직건강 및 리스크 관리</a>
      <a href="./readme.html" class="hr-dash__nav-guide" target="_blank" rel="noopener">*개발자 작업가이드</a>
    </nav>

    <!-- 상단 3열(산업재해 · 안전교육 · 건강검진) + 하단 전체 폭(사내 고충) -->
    <div class="hr-dash__grid-stub hr-dash__grid-stub--3-1">
      <div class="hr-dash__card">
        <div class="hr-dash__card-head">
          <h2 class="hr-dash__card-title"><span class="hr-dash__title-main">산업재해 건수</span> <span class="hr-dash__title-sub">2026년 누적 기준(반기별 업데이트)</span></h2>
        </div>
        <div class="hr-dash__chart"><canvas id="chart04Accident"></canvas></div>
      </div>

      <div class="hr-dash__card">
        <div class="hr-dash__card-head">
          <h2 class="hr-dash__card-title"><span class="hr-dash__title-main">안전교육 이수율</span> <span class="hr-dash__title-sub">2026년 누적 기준(반기별 업데이트)</span></h2>
        </div>
        <div class="hr-dash__safe">
          <div class="hr-dash__safe-legend" id="safeLegend"></div>
          <div class="hr-dash__safe-item">
            <div class="hr-dash__safe-chart">
              <canvas id="chart04Safe1"></canvas>
              <span class="hr-dash__safe-center">상반기</span>
            </div>
          </div>
          <div class="hr-dash__safe-item">
            <div class="hr-dash__safe-chart">
              <canvas id="chart04Safe2"></canvas>
              <span class="hr-dash__safe-center">하반기</span>
            </div>
          </div>
        </div>
      </div>

      <div class="hr-dash__card">
        <div class="hr-dash__card-head">
          <h2 class="hr-dash__card-title"><span class="hr-dash__title-main">건강검진 수검율</span> <span class="hr-dash__title-sub">2026년 누적 기준(연 1회 업데이트)</span></h2>
        </div>
        <div class="hr-dash__chart"><canvas id="chart04Checkup"></canvas></div>
      </div>

      <div class="hr-dash__card">
        <div class="hr-dash__card-head">
          <h2 class="hr-dash__card-title"><span class="hr-dash__title-main">사내 고충 접수(조치) 건수</span> <span class="hr-dash__title-sub">과거 2개년은 12월말 기준, 최신년도는 분기별 업데이트</span></h2>
        </div>
        <div class="hr-dash__griev-wrap" id="grievTable"></div>
      </div>
    </div>
  </div>

  <script src="./e-HR_files/jquery-1.11.2.min.js"></script>
  <script src="./e-HR_files/jquery-migrate-1.4.1.min.js"></script>
  <script src="./e-HR_files/chartjs-4.5.0.js"></script>
  <script src="./e-HR_files/chartjs-plugin-datalabels.js"></script>
  <script src="./js/dashboard04.js"></script>
</body>
</html>
